name: Monthly KD Screener

on:
  schedule:
    # 台灣時間每月 1 號早上 09:17 (UTC 01:17) 自動觸發，避開整點與15分排隊高峰
    - cron: '17 1 1 * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行
  
jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴庫
        run: pip install -r requirements.txt

      - name: 執行月KD運算與寫入
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: python kd_screener.py
